spring.application.name=albaraka

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5435/albaraka_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# JWT Configuration
app.jwt.secret=LKJQSDFLB4B34ON3OIBOJ4OIJ30J430JI3J4I0304IJ304J304J04J094J0349J304JN3T43J3OI4J3IJ4TJG093J404J34J03J4
app.jwt.expiration=86400000

# Logging Configuration
logging.level.com.ilyassan.albaraka=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

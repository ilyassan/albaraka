spring.application.name=albaraka

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5435/albaraka_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# JWT Configuration
app.jwt.secret=LKJQSDFLB4B34ON3OIBOJ4OIJ30J430JI3J4I0304IJ304J304J04J094J0349J304JN3T43J3OI4J3IJ4TJG093J404J34J03J4
app.jwt.expiration=86400000

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads

# Logging Configuration
logging.level.com.ilyassan.albaraka=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Spring AI - Google Vertex AI Gemini Configuration
spring.ai.vertex.ai.gemini.project-id=${GEMINI_PROJECT_ID:albaraka-banking}
spring.ai.vertex.ai.gemini.location=${GEMINI_LOCATION:us-central1}
spring.ai.vertex.ai.gemini.api-key=${GEMINI_API_KEY}
spring.ai.vertex.ai.gemini.chat.options.model=${GEMINI_MODEL:gemini-1.5-flash}
spring.ai.vertex.ai.gemini.chat.options.temperature=${GEMINI_TEMPERATURE:0.7}

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

spring.application.name=albaraka-test

# Server Configuration
server.servlet.context-path=/api

# Use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT Configuration
app.jwt.secret=testSecretKeyThatIsLongEnoughForHS512AlgorithmAndCanBeUsedForSigningJWTTokens
app.jwt.expiration=86400000

# Disable OAuth2 client for tests (Keycloak not available)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

# Disable Spring AI auto-configuration for tests
spring.ai.autoconfigure.enabled=false
spring.ai.vertexai.gemini.enabled=false

# Logging
logging.level.com.ilyassan.albaraka=INFO
